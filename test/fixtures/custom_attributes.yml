# Labels and option values here are real ones, not placeholders: CustomAttribute validates
# both against config/locales/en.yml, so a synthetic label like `number` would be a row the
# application would refuse to save. Each fixture still exists to cover one input type.
one:
  id: 1
  label: channel_configuration
  highlighted: true
  input_type: option
  options:
    "1": stereo
    "2": dual-mono
  sub_categories:
    - one
two:
  id: 2
  label: turntable_drive_type
  highlighted: false
  input_type: option
  options:
    "1": belt-drive
    "2": direct-drive
  sub_categories:
    - one
    - two
three:
  id: 3
  label: loudspeaker_driver_types
  highlighted: false
  input_type: options
  options:
    "1": coaxial
    "2": horn_loaded
  sub_categories:
    - one
    - two
four:
  id: 4
  label: weight
  highlighted: false
  input_type: number
  sub_categories:
    - one
    - two
five:
  id: 5
  label: loudspeaker_bi_wiring
  highlighted: false
  input_type: boolean
  sub_categories:
    - one
    - two
six:
  id: 6
  label: dimensions
  highlighted: false
  input_type: number
  inputs:
    - w
    - h
    - l
  units:
    - cm
    - in
  sub_categories:
    - one
    - two

# Related Products gate attributes. `highlighted` is false here although amplifier_type is
# highlighted in production: highlighted attributes enter the completeness denominator, and
# these fixtures exist to exercise gates, not to restate production's scoring.
seven:
  id: 7
  label: amplifier_type
  highlighted: false
  input_type: option
  options:
    "1": solid_state
    "2": tube
    "3": hybrid
  sub_categories:
    - one
eight:
  id: 8
  label: headphone_connection_type
  highlighted: false
  input_type: option
  options:
    "1": wired
    "2": wireless
  sub_categories:
    - two
