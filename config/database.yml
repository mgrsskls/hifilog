# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  prepared_statements: false
  advisory_locks: false

development:
  <<: *default
  database: hifigear_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: hifigear_test

production:
  <<: *default
  database: hifigear_production
  # Solid Queue runs as threads in the Puma process (see config/puma.rb). Thus the pool must
  # also hold the connections of the worker threads, the dispatcher and the heartbeats: Puma
  # threads + 5. A connection opens only when a thread needs it.
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 } %>
