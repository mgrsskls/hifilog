AllCops:
  NewCops: enable
  Exclude:
    - db/migrate/**/*
    - db/schema.rb
    - config/**/*
    - script/**/*
    - bin/**/*
    - app/admin/**/*
    - app/channels/**/*
    - app/jobs/**/*
    - node_modules/**/*
    - Gemfile
    - Rakefile
    - config.ru
    - vendor/**/*

plugins: rubocop-rails

Style/Documentation:
  Description: "Document classes and non-namespace modules."
  Enabled: false

Style/ClassAndModuleChildren:
  EnforcedStyle: compact

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - test/**/*

Metrics/MethodLength:
  Enabled: false

Rails/HasAndBelongsToMany:
  Enabled: false

# Scenic view-backed rows are read-only (`readonly?` is true) and their associations point at
# real tables via synthetic keys. A `:dependent` option would either be dead code or, worse,
# cascade a delete out of a view into a base table.
Rails/HasManyOrHasOneDependent:
  Exclude:
    - app/models/concerns/catalogue_product_row.rb
    - app/models/product_item.rb

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Style/SymbolArray:
  EnforcedStyle: brackets

Metrics/ClassLength:
  Enabled: false
