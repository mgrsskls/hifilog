# ---------------------------------------------------------------------------
# Decisions for one brand's own word, read from the products under it.
#
# These were made by looking at the product names in each pair rather than at
# the word alone: "Speaker" at one brand is a portable Bluetooth box, at
# another an in-wall driver. A pair whose products are of two kinds is left
# undecided on purpose and waits for the review -- the same rule as above.
#
# Most of the largest pairs are refusals. A hi-fi brand's shop sells its
# television range, its car radios, its spare grilles and its ear cushions from
# the same catalogue, and one line keeps each of those out of the queue.
# ---------------------------------------------------------------------------

# Blaupunkt sells televisions, car radios, kitchen appliances and power strips
# beside its audio, and what audio it does sell is portable and in-car. The
# whole brand is answered with one rule rather than with twenty refusals, which
# would have recorded the same decision as twenty small ones.
- brand: blaupunkt
  source_category: '*'
  out_of_scope: true

