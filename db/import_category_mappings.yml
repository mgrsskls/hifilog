# What a shop's own word means in this catalogue.
#
# Written by reading the 1680 distinct category words that 245 shops used in the
# first markup-only import, biggest first. It is a proposal: read it as a diff
# and correct it before loading. `rake import:mappings:load` applies it, and
# `rake import:map` then classifies the candidates that are waiting.
#
# Three rules were followed:
#
#   * A word is mapped only when it names one sub category and no other.
#     "Speakers", "Lautsprecher" and "Loudspeakers" are NOT mapped: a shop that
#     writes only that has floorstanders and bookshelf models under one word,
#     and guessing would put both in one place. Those wait for the review.
#   * A word is refused when it names something this catalogue does not hold:
#     car and marine audio, studio and PA, television, appliances, tools, and
#     recordings. This is the cheapest decision in the file -- one line removes
#     a hundred candidates that a person would otherwise refuse by hand.
#   * A brand's series name ("Sage Series", "Compass Collection") is left alone.
#     It says nothing about what the product is.
#
# Words that were mapped in the first draft and then taken out again, so that
# nobody puts them back. Each one names more than one sub category, so a
# mapping would classify hundreds of products silently and wrongly. They are
# answered per product, not per word:
#
#   Amplifiers, Amplifier, Audio Amplifiers  integrated, power, pre, headphone
#                                            or a receiver
#   2 Channel Amplifier                      a stereo power amplifier, or a car
#                                            amplifier
#   Einbaulautsprecher                       in-wall or in-ceiling
#   Power Distributors                       a distribution block is not a
#                                            conditioner, and this catalogue has
#                                            no sub category for one
#   Record Cleaning Machines                 no sub category for one
#   Speakers, Lautsprecher, Loudspeakers     floorstanding or bookshelf
#   Headphones                               over-ear, on-ear or in-ear
#   Cables, Kabel, Audio Cable               five kinds of cable
#   Accessories, Zubehör, Accessoires        stands, spikes, racks, cloths
#   Wandlautsprecher                         on-wall or in-wall
#
# No brand is named on any line, so each applies to every shop that writes the
# word. Add a brand to a line where one shop means something of its own by it.
#
# `sub_categories` is a list because a word can name two things and a product
# can be two things: a shop's "In-Wall Subwoofers" is both, and so is the
# product in it.
---
